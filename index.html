<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Likitha ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:90%;
    max-width:700px;
    background:white;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    position:relative;
    z-index:2;
}

h1{
    color:#ff3366;
    margin-bottom:20px;
}

.message{
    font-size:22px;
    color:#444;
    line-height:1.8;
    min-height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

button{
    background:#ff3366;
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:30px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    transform:scale(1.05);
}

.heart{
    position:absolute;
    color:red;
    animation:float 8s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(100vh);
        opacity:0;
    }
    10%{
        opacity:1;
    }
    100%{
        transform:translateY(-120vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>💖 I AM MISSING YOU A LOT LIKITHA 💖</h1>

<div class="message" id="message">
Press "Open My Heart ❤️"
</div>

<button id="mainBtn" onclick="nextMessage()">
Open My Heart ❤️
</button>

</div>

<script>

const messages = [

"😭❤️ Likitha... Before you read anything, I just want you to know one thing... I miss you more than words can explain.",

"Likitha, I am missing you a lot 😭❤️",

"As days pass you may think I am forgetting you... But roju rojuki chala ante chala mental ekkisthunnav 😔",

"I don't know if you realize it, but I miss you more than I can put into words ❤️",

"Ela unnav ma 😭🥺😭 Chala days avthundhe ni gonthu vini...",

"30 days ayipoyayi mana matladukoni 😔",

"Every day I check my phone hoping to see a message from you ❤️",

"No matter how angry you are with me, you are still my favourite person ❤️",

"I never wanted to hurt you 😭",

"I LOVE YOU MAAA ❤️",

"I AM VERY SORRY FOR EVERYTHING WHAT I HAVE DONE 🙏😭",

"If possible please forgive me 🥺❤️",

"Forever waiting for your smile again 😭❤️",

"❤️ LOVE YOU LIKITHA ❤️"
];

let index = -1;

function nextMessage(){

index++;

if(index < messages.length){

document.getElementById("message").innerHTML =
messages[index];

document.getElementById("mainBtn").innerHTML =
"Next ❤️";

}
else{

document.getElementById("message").innerHTML =
"❤️ THANK YOU FOR READING ❤️<br><br>Likitha, I Love You Maaa 😭❤️";

document.getElementById("mainBtn").style.display =
"none";
}
}

function createHeart(){

const heart = document.createElement("div");

heart.classList.add("heart");

heart.innerHTML = "❤️";

heart.style.left = Math.random()*100 + "vw";

heart.style.fontSize = (20 + Math.random()*25) + "px";

heart.style.animationDuration =
(5 + Math.random()*5) + "s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},10000);

}

setInterval(createHeart,500);

</script>

</body>
</html>
