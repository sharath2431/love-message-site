```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Likitha ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
overflow:hidden;
}

.container{
width:90%;
max-width:750px;
background:white;
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
position:relative;
z-index:2;
}

h1{
color:#ff3366;
margin-bottom:20px;
}

.message{
font-size:22px;
line-height:1.8;
color:#444;
min-height:250px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
}

button{
background:#ff3366;
color:white;
border:none;
padding:15px 35px;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin:8px;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.heart{
position:absolute;
color:red;
animation:float 8s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1>❤️ FOR LIKITHA ❤️</h1>

<div class="message" id="message">
Press "Open My Heart ❤️"
</div>

<button id="mainBtn" onclick="nextMessage()">
Open My Heart ❤️
</button>

</div>

<script>

const messages = [

"Hii Likitha ❤️<br><br>Ela unav... Ninnu chala miss avthunna ra. I miss you a lot. 🥺❤️<br><br>Happy ga undu beta, devudini adigesa nuvvu happy ga undalani. ❤️<br><br>Sorry, ninnu ibbandi pettali ani kadhu ra. Okkasari ee message motham chadhuvu. 🥺<br><br>Next kottu ma ❤️",

"Likitha... Sorry ra. 😔❤️<br><br>Navi chala mistakes unnayi. Ninnu ala ani undakudadhu ra.<br><br>Chala regret ga undi naku.<br><br>Ni daggara nak ego em ledhu ra.<br><br>Please epudu nak ego undi ani anukoku sare na. 🥺<br><br>Ni tarvathane nak em ayina. ❤️",

"Inka ninnu malla epudu chusthano maa telidhu. 😭❤️<br><br>Ee month end tarvatha chala benga ga undi.<br><br>Niku dooram vellipovali ani asal ledhu ra.<br><br>Ni kosam eppatiki wait chesthu unta beta.<br><br>Any second... just oka message chey chalu. 🥺❤️",

"I AM SO SORRY MY LOVE ❤️😭<br><br>Manaki this is the last hope in love.<br><br>I miss you badly. 🥺<br><br>Asal kasepu kuda gurthu rakunda undavu telsa.<br><br>I LOVE YOU ❤️",

"Ninnu em disturb cheyanu beta inka. 🥺❤️<br><br>Dhinki kuda ibbandhi ga unte so sorry ra.<br><br>Mana memories tho life long undipovachu.<br><br>Nannu marchipoke. 🥺❤️<br><br>Bye Likithaaaaaa... ❤️😭"

];

let index = -1;
let musicStarted = false;

function nextMessage(){

if(!musicStarted){
document.getElementById("bgMusic").play();
musicStarted = true;
}

index++;

if(index < messages.length){

document.getElementById("message").innerHTML = messages[index];
document.getElementById("mainBtn").innerHTML = "Next ❤️";

}else{

document.getElementById("message").innerHTML =
"❤️ THANK YOU FOR READING ❤️<br><br>I LOVE YOU LIKITHA ❤️";

document.getElementById("mainBtn").style.display = "none";

}

}

function createHeart(){

const heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*25)+"px";
heart.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},10000);

}

setInterval(createHeart,500);

</script>

</body>
</html>
