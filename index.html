<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Likitha ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
overflow:hidden;
}

.container{
width:90%;
max-width:750px;
background:white;
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
position:relative;
z-index:2;
}

h1{
color:#ff3366;
margin-bottom:20px;
}

.message{
font-size:22px;
line-height:1.8;
color:#444;
min-height:250px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
}

button{
background:#ff3366;
color:white;
border:none;
padding:15px 35px;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin:8px;
}

button:hover{
transform:scale(1.05);
}

.heart{
position:absolute;
color:red;
animation:float 8s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1>❤️ FOR LIKITHA ❤️</h1>

<button onclick="playMusic()">🎵 Play Music</button>

<div class="message" id="message">
Press "Open My Heart ❤️"
</div>

<button id="mainBtn" onclick="nextMessage()">
Open My Heart ❤️
</button>

</div>

<script>

const messages = [

"Hii ma ela unav ❤️<br><br>I hope you will read this msg.<br><br>Chala days ayindi kadha beta manam matladi.<br><br>Nak ela start cheyalo ardam avvatle kani e msg netho okasri call matladinkanaka pedutham anukuntunn ra.<br><br>Next kottu ma ❤️",

"30 days ayindi ma nen netho matladi.<br><br>Chala miss avthunna ninnu.<br><br>Unnapudu arichina kani nadhe thappu.<br><br>Enthala miss avthunano cheppalene.<br><br>Intlo chala days unav contact avdham ani chala sarlu anukunna kani family untaru ani agipoyina.<br><br>Ochinaka matladudham ani anukunna 😭❤️",

"Roju rojuki pichi lesthundi maa.<br><br>I know I have messed up a lot.<br><br>Chala matalu anna, chala hurt chesa.<br><br>Asal sorry cheppe right kuda ledhu naku.<br><br>And you know what...",

"Anipisthundi naku ninnu chance kuda adugalenu ani.<br><br>Because you already gave me a second chance.<br><br>But I can't lose you from my life.<br><br>I AM SO SORRY MY LOVE ❤️😭",

"Manaki this is the last hope in love.<br><br>I miss you badly.<br><br>Asal kasepu kuda gurthu rakunda undavu telsa.<br><br>Sare rest nik call lo cheppi unta.<br><br>I LOVE YOU ❤️",

"Please don't forget to fulfill my 2 wishes which I have asked you 🥺❤️",

"AT LAST ❤️<br><br>I DON'T KNOW WHAT DESTINY HAS PLANNED FOR US.<br><br>BUT I KNOW 1 THING...<br><br>I CAN'T UNLOVE YOU ❤️😭"

];

let index = -1;

function nextMessage(){

index++;

if(index < messages.length){

document.getElementById("message").innerHTML = messages[index];

document.getElementById("mainBtn").innerHTML = "Next ❤️";

}
else{

document.getElementById("message").innerHTML =
"❤️ THANK YOU FOR READING ❤️<br><br>I LOVE YOU LIKITHA ❤️";

document.getElementById("mainBtn").style.display = "none";

}

}

function playMusic(){
document.getElementById("bgMusic").play();
}

function createHeart(){

const heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*25)+"px";

heart.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},10000);

}

setInterval(createHeart,500);

</script>

</body>
</html>
