<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Likitha ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
overflow:hidden;
}

.container{
width:90%;
max-width:700px;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 0 30px rgba(0,0,0,0.2);
text-align:center;
position:relative;
z-index:2;
}

h1{
color:#ff3366;
margin-bottom:20px;
}

.message{
font-size:22px;
line-height:1.8;
color:#444;
min-height:180px;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

button{
padding:15px 35px;
border:none;
border-radius:30px;
background:#ff3366;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

.heart{
position:absolute;
font-size:25px;
animation:float 8s linear infinite;
opacity:0.6;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

#musicBtn{
margin-top:15px;
background:#ff6699;
}
</style>
</head>

<body>

<audio id="bgmusic" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1>💖 I AM MISSING YOU A LOT LIKITHA 💖</h1>

<div class="message" id="message">
Click below 😭❤️
</div>

<button onclick="nextMessage()">Read My Heart ❤️</button>

<br>

<button id="musicBtn" onclick="playMusic()">
🎵 Play Music
</button>

</div>

<script>

const messages = [

"Likitha, I am missing you a lot 😭❤️",

"As days pass you may think I am forgetting you... But roju rojuki chala ante chala mental ekkisthunnav 😔",

"I don't know if you realize it, but I miss you more than I can put into words ❤️",

"Ela unnav ma 😭🥺😭 Chala days avthundhe ni gonthu vini...",

"30 days ayipoyayi mana matladukoni 😔",

"Every day I check my phone hoping to see a message from you ❤️",

"No matter how angry you are with me, you are still my favourite person ❤️",

"I never wanted to hurt you 😭",

"I LOVE YOU MAAA ❤️",

"I AM VERY SORRY FOR EVERYTHING WHAT I HAVE DONE 🙏😭",

"If possible please forgive me 🥺❤️",

"Forever waiting for your smile again 😭❤️",

"❤️ LOVE YOU LIKITHA ❤️"
];

let index = -1;

function nextMessage(){

index++;

if(index < messages.length){
document.getElementById("message").innerHTML =
messages[index];
}
else{
document.getElementById("message").innerHTML =
"❤️ Thank You For Reading ❤️<br><br>I Love You Maaa 😭❤️";
}
}

function playMusic(){
document.getElementById("bgmusic").play();
}

function createHeart(){

const heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*30)+"px";

heart.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},10000);

}

setInterval(createHeart,500);

</script>

</body>
</html>
